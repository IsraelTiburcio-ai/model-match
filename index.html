<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1026">
  <meta name="description" content="MODEL MATCH — Clasifica el modelo correcto. Microjuego educativo sobre la clasificación de modelos: Icónico, Analógico y Simbólico.">
  <title>MODEL MATCH · Clasifica el modelo correcto</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="bgfx" aria-hidden="true">
      <div class="blob blob-a"></div>
      <div class="blob blob-b"></div>
      <div class="blob blob-c"></div>
    </div>

    <main class="shell">

      <!-- ============ PORTADA ============ -->
      <section id="screen-title" class="screen screen-title active" aria-labelledby="gameTitle">
        <header class="title-head">
          <span class="eyebrow">GIMNASIO 2 · Optimización I</span>
          <h1 id="gameTitle" class="game-title">
            MODEL <span class="title-accent">MATCH</span>
          </h1>
          <p class="subtitle">Clasifica el modelo correcto</p>
        </header>

        <div class="legend" role="list" aria-label="Categorías del juego">
          <div class="legend-chip" role="listitem" data-cat="iconico">
            <span class="chip-icon" aria-hidden="true"></span>
            <span class="chip-label">Icónico</span>
          </div>
          <div class="legend-chip" role="listitem" data-cat="analogico">
            <span class="chip-icon" aria-hidden="true"></span>
            <span class="chip-label">Analógico</span>
          </div>
          <div class="legend-chip" role="listitem" data-cat="simbolico">
            <span class="chip-icon" aria-hidden="true"></span>
            <span class="chip-label">Simbólico</span>
          </div>
        </div>

        <p class="howto">Clasifica 8 modelos tocando la categoría correcta. ¡Rápido!</p>

        <button id="btnPlay" class="btn btn-primary" type="button">▶ JUGAR</button>
        <p class="hint-keys" aria-hidden="true">También con teclado: 1 · 2 · 3 · Enter</p>
      </section>

      <!-- ============ GAMEPLAY ============ -->
      <section id="screen-game" class="screen screen-game" aria-hidden="true" aria-label="Juego">
        <div class="hud">
          <div class="hud-pill" id="timePill" aria-label="Tiempo">
            <span class="hud-icon" aria-hidden="true"></span>
            <span id="timeValue">0 s</span>
          </div>
          <div class="hud-pill hud-score" aria-label="Aciertos">
            <span class="hud-icon" aria-hidden="true"></span>
            <span id="scoreValue">0</span><span class="score-max" id="scoreMax">/8</span>
          </div>
        </div>

        <div class="dots" id="dots" aria-hidden="true"></div>

        <div id="stage" class="stage" aria-live="polite">
          <div class="card" id="card">
            <div class="card-display" id="cardDisplay"></div>
            <h2 class="card-label" id="cardLabel"></h2>
            <p class="card-hint" id="cardHint"></p>
          </div>
        </div>

        <div class="deck" id="deck"></div>

        <p class="sr-status" id="srStatus" role="status" aria-live="assertive"></p>
      </section>

      <!-- ============ RESULTADO ============ -->
      <section id="screen-result" class="screen screen-result" aria-hidden="true" aria-labelledby="resultTitle">
        <div class="result-emoji" id="resultEmoji" aria-hidden="true"></div>
        <h2 id="resultTitle" class="result-title">¡Excelente!</h2>
        <div class="result-stats" role="status">
          <div class="stat">
            <span class="stat-value" id="resultScore">7/8</span>
            <span class="stat-label">Aciertos</span>
          </div>
          <div class="stat">
            <span class="stat-value" id="resultTime">58 s</span>
            <span class="stat-label">Tiempo</span>
          </div>
        </div>
        <button id="btnAgain" class="btn btn-primary" type="button">↻ JUGAR OTRA VEZ</button>
        <button id="btnHome" class="btn btn-ghost" type="button">Volver al inicio</button>
      </section>

    </main>

    <button id="btnMute" class="btn-mute" type="button" aria-pressed="false" aria-label="Silenciar sonido"></button>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
